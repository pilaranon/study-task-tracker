<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Study Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">

    <main class="auth-container register-container" aria-labelledby="registerTitle">
        <div class="auth-card register-card">
            <p class="auth-brand">Study Planner</p>
            <h1 id="registerTitle">Create account</h1>
            <p class="auth-intro">Start tracking your tasks, due dates, and priorities in one place.</p>

            {% if error %}
                <p class="error-message" role="alert">{{ error }}</p>
            {% endif %}

            <form method="POST" action="/register">
                <div class="form-field">
                    <label for="username">Username</label>
                    <input id="username" type="text" name="username" placeholder="Choose a username" autocomplete="username" required>
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" placeholder="Create a password" autocomplete="new-password" required>
                </div>

                <button class="auth-submit" type="submit">Create account</button>
            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="/login">Log in</a>
            </p>
        </div>
    </main>

</body>
</html>
